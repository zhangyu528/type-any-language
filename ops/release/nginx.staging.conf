# Nginx config for ephemeral staging (used inside docker compose).
#
# This is a COMPLETE nginx.conf (events + http + server) since it runs
# standalone in a container, not as an nginx fragment.
#
# Upstreams use docker compose service names (resolvable via DNS in the
# compose network):
#   - backend:8000  (FastAPI on 127.0.0.1:8000 inside the backend container)
#   - frontend:3000 (Next.js on 127.0.0.1:3000 inside the frontend container)

worker_processes 1;
pid /tmp/nginx.pid;
error_log /tmp/nginx-error.log warn;

events {
    worker_connections 1024;
}

http {
    access_log /tmp/nginx-access.log;

    upstream tal_backend {
        server backend:8000;
    }

    upstream tal_frontend {
        server frontend:3000;
    }

    server {
        listen 8080;
        server_name _;

        # Allow all CORS (staging is for testing)
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;

        # API: route to backend
        location /api/ {
            proxy_pass http://tal_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Frontend: route everything else to Next.js
        location / {
            proxy_pass http://tal_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
