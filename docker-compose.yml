# ---------------------------------------------------------------------------
# Production docker-compose for type-any-language.
#
# !! DO NOT invoke this file with a bare `docker compose -f <path>` !!
# Every relative path below (secrets file, build contexts) is written
# RELATIVE TO THE REPO ROOT, but compose resolves them against this
# file's own directory (the repo root). Always go through
# ops/cvm/_common.sh's compose() wrapper, or pass
# `--project-directory <repo-root>` yourself. Entry points:
#     ./ops/cvm/lifecycle.sh start|stop|restart
#
# Runtime model: 3 services, all on the CVM, on the same compose project.
# Pulled as a unit and recreated together on `lifecycle.sh restart`.
#
# Custom db image (db/Dockerfile):
#   The db service uses a LOCAL build (not the upstream postgres image
#   anymore). The custom image bakes in:
#     - backend/migrations/  (schema migrations)
#     - db/importer.py       (UPSERT logic)
#     - cms/content/         (vocab + sentences data)
#   The custom entrypoint (db/image-entrypoint.sh) runs migrations +
#   import on every container start, idempotently. So:
#     - First start on a fresh /var/lib/postgresql/data: empty → apply
#       ALL migrations → import ALL content → db ready
#     - Subsequent starts with persisted data: schema is current →
#       migrations.runner is a no-op → importer UPSERTs (also idempotent)
#     - New image pulled (new VERSION): apply any new migrations +
#       re-import any new content automatically
#
# Three services, all on the CVM:
#   db       — english_db:${DB_IMAGE_TAG}, custom (see above)
#   backend  — FastAPI / uvicorn, no reload. Connects to db via
#              DATABASE_URL env. Does NOT run migrations (db handles it).
#   frontend — Next.js standalone build, serves the UI on :3000.
#              Static assets are served by nginx; SSR happens here.
#              Browser hits nginx, which proxies / to this.
#
# nginx is NOT a service here — it is the host's apt-installed system
# nginx, configured from ops/cvm/nginx/site.conf. It routes:
#   /api/          → 127.0.0.1:8000 (backend)
#   /_next/static/ → /var/lib/type-any-language/frontend-static (direct)
#   /              → 127.0.0.1:3000 (frontend)
#
# Run via:  ALLOWED_ORIGINS=https://my.domain ./ops/cvm/lifecycle.sh start
# Image sources:
#   - db / backend / frontend: PULLED from ${DOCKER_REGISTRY}
#     (GitHub Container Registry / GHCR — ghcr.io/zhangyu528/type-any-language).
#     These are custom images built + pushed by release-prod CI.
# lifecycle.sh runs `docker compose up --no-build`, so compose NEVER builds
# locally; CI (release-build.yml) is the only place images are produced. The
# build: blocks below exist purely so CI can reuse this file as the build
# definition — they are never exercised on the CVM.
# DOCKER_REGISTRY is forwarded to the CVM via SSH env by the publish-prod /
# bootstrap-prod workflows (single source of truth = GH Variable).
# ---------------------------------------------------------------------------

secrets:
  # Used by the db service only (read by the postgres entrypoint).
  # Generated by the operator on first setup via `openssl rand -hex 32`
  # and dropped into ./.dbcreds/db_password (chmod 600). The default
  # English_password below is intentionally insecure — replace via
  # docker compose run --rm -it db bash before going live, or use a
  # secrets manager (TENCENT_CLOUD secret manager, etc.).
  # The `secrets:` block here is read by docker, not by the backend.
  db_password:
    file: ./.dbcreds/db_password

services:
  # -------------------------------------------------------------------------
  # db — custom image, applies migrations + imports content on every start
  # -------------------------------------------------------------------------
  db:
    image: ${DOCKER_REGISTRY}/english_db:${DB_IMAGE_TAG:-latest}
    build:
      # Build context is the repo root so we can COPY backend/, db/,
      # cms/. See db/Dockerfile for the contents baked in.
      context: .
      dockerfile: db/Dockerfile
      args:
        APP_VERSION: ${DB_IMAGE_TAG:-latest}
        GIT_SHA: ${GIT_SHA:-unknown}
    container_name: ${COMPOSE_PROJECT_NAME:-type-any-language}-db
    environment:
      POSTGRES_USER: english_prod
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password  # see secrets: above
      POSTGRES_DB: english_prod
      # Importer reads CMS content from this dir. db/Dockerfile bakes
      # cms/content/ into /app/cms_content/ in the image. Without this
      # env var, importer.py::find_content_dir() falls back to
      # find_project_root()/"cms"/"content" — but find_project_root() is
      # Path("/app/importer.py").parent.parent == "/", so it looks at the
      # non-existent /cms/content, finds nothing, and the DB stays empty
      # (vocabulary_libs has 0 rows) → /api/content/catalog returns
      # {"libs":[]} → homepage spins on an empty catalog forever.
      # Setting this makes the importer import on every db start (idempotent
      # UPSERT), so the catalog is populated after a db recreate.
      CMS_CONTENT_DIR: /app/cms_content
    # Mount the db_password secret so POSTGRES_PASSWORD_FILE resolves.
    # Without this block, the file exists at the top-level `secrets:`
    # config but is never injected into this container, and the
    # postgres entrypoint fails on the very first read with:
    #   `/run/secrets/db_password: No such file or directory`
    secrets:
      - db_password
    volumes:
      # Persistent data — bind-mounted to /var/lib/postgresql/data on the
      # CVM. Operator: create this dir + chown to UID 999 (postgres
      # alpine user) before first `docker compose up`.
      - /var/lib/type-any-language/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U english_prod -d english_prod"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # Backend — FastAPI / uvicorn. NO migrations, NO content import
  # (db image's entrypoint handles those). Just serves API.
  # -------------------------------------------------------------------------
  backend:
    image: ${DOCKER_REGISTRY}/english_backend:${BACKEND_IMAGE_TAG:-latest}
    build:
      context: ./backend
      args:
        APP_VERSION: ${BACKEND_IMAGE_TAG:-latest}
        GIT_SHA: ${GIT_SHA:-unknown}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost}
      # DATABASE_URL is assembled at container start by
      # backend/image-entrypoint.sh, which reads /run/secrets/db_password
      # and exports the resulting DSN into this container's env. compose's
      # environment: block doesn't run a shell, so we can't inline the
      # secret read here — instead, the entrypoint does it once at boot.
      # Compose syntax doesn't allow `$(cat ...)` expansion; it would
      # land in the env as the literal string "$(cat ...)".
    # See db service above for why this block is needed.
    secrets:
      - db_password
    # Expose to host so the system nginx can reverse-proxy to it
    # (see ops/cvm/nginx/site.conf). Compose-internal
    # routing still uses backend:8000 from the frontend container.
    ports:
      - "127.0.0.1:8000:8000"

  # -------------------------------------------------------------------------
  # Frontend — Next.js standalone build. Browser hits nginx, which
  # proxies / to this service. NEXT_PUBLIC_API_URL is baked in at
  # build time (it's the URL the browser uses to call backend).
  # -------------------------------------------------------------------------
  frontend:
    image: ${DOCKER_REGISTRY}/english_frontend:${FRONTEND_IMAGE_TAG:-latest}
    build:
      context: ./frontend
      args:
        APP_VERSION: ${FRONTEND_IMAGE_TAG:-latest}
        GIT_SHA: ${GIT_SHA:-unknown}
        # The browser's API base URL. Use "/" for same-origin prod: nginx
        # already routes /api/ -> backend, and the client appends the "/api"
        # segment itself, so a "/api" base would DOUBLE it (/api/api/...).
        # Override for cross-origin setups
        # (e.g. NEXT_PUBLIC_API_URL=https://api.example.com).
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/}
    restart: unless-stopped
    depends_on:
      - backend
    # Expose to host so the system nginx can reverse-proxy to it
    # (see ops/cvm/nginx/site.conf). Same 127.0.0.1
    # bind as backend — host-only, never reachable from the public
    # internet directly.
    ports:
      - "127.0.0.1:3000:3000"
    # Export the standalone build's static assets to a host path so the
    # system nginx can serve /_next/static/ directly (faster + removes the
    # dependency on the Node server serving hashed static files). The
    # static assets live at /app/.next-build/static (the build output),
    # NOT under .next-build/standalone/.next/static — the standalone
    # server does NOT auto-populate that path, which is exactly why every
    # /_next/static/* request 404'd. So the command copies from the REAL
    # build-output location into the export mount, then runs server.js.
    #
    # Why `rm -rf` first (not just `cp -rf`): on a recreate the host export
    # dir already exists, and `cp -rf src dest` where dest exists nests the
    # source inside it (dest/static/...), so fresh hash-busted filenames
    # would land in the wrong place and nginx would 404 them every time.
    # Wiping + re-copying gives a clean layout on every recreate.
    #
    # Why `&&` (fail-fast), NOT `;`: if the build output is ever missing,
    # a `;` lets node start anyway with an EMPTY export dir → page loads
    # but every /_next/static/* 404s (silent, hard to spot in prod). With
    # `&&`, a failed copy crashes the container loudly so a broken image
    # can never ship a working-looking-but-static-less deploy.
    volumes:
      - /var/lib/type-any-language/frontend-static:/static-export:rw
    command: sh -c "rm -rf /static-export/.next/static && cp -rf /app/.next-build/static /static-export/.next/static && exec node /app/.next-build/standalone/server.js"

  # -------------------------------------------------------------------------
  # nginx — deliberately NOT a service here.
  #
  # The dockerised nginx service was removed in favour of the host's
  # system nginx (this CVM ships nginx via apt). Two reasons it stayed
  # removed: (1) pulling nginx:alpine from docker.io made `docker
  # compose up -d` exit non-zero on this CVM — the daemon's OCI-referrer
  # query against registry-1.docker.io times out even though the layers
  # download fine; (2) the host nginx can serve /_next/static/ straight
  # off the bind-mounted export path without another hop.
  #
  # The system nginx reads ops/cvm/nginx/site.conf and reverse-proxies to
  # backend + frontend on host 127.0.0.1 (see the ports: blocks above).
  # Installed + reloaded by ops/cvm/nginx/install.sh, which
  # ops/cvm/bootstrap.sh::step_nginx_site_link calls during host prep.
  # -------------------------------------------------------------------------
