name: diag-prod
run-name: diag-prod-on-${{ inputs.target || 'auto' }}

# -----------------------------------------------------------------------
# One-shot "is the mirror config working?" test.
#
# Goal: prove that adding ghcr.io mirrors to /etc/docker/daemon.json on the
# prod CVM actually speeds up `docker pull` end-to-end.
#
# What it does, in order:
#   1. Back up the current daemon.json.
#   2. Write a fresh daemon.json with the 4 known mirrors (Tencent + DaoCloud
#      docker.io + DaoCloud ghcr + NJU ghcr).
#   3. systemctl restart docker so the daemon picks up the new config.
#   4. Verify via `docker info` that the new mirrors are listed.
#   5. (optional) docker login ghcr.io via GITHUB_TOKEN to bypass anonymous
#      pool rate-limits — required for any docker pull to succeed.
#   6. rmi the cached frontend image so the pull below is a real download,
#      not a cache hit.
#   7. time docker pull english_frontend:v0.1.0 — this is the actual answer.
#
# If step 7 finishes in seconds, the mirror is wired up correctly. If it
# crawls at KB/s, the mirror is wrong (or the CVM egress to the mirror is
# also rate-limited).
#
# Required GH Secrets / Variables (same as deploy-prod):
#   secrets.CVM_HOST, secrets.CVM_BOOTSTRAP_SSH_KEY
#   vars.DOCKER_REGISTRY  (printed in the report header, not consumed)
#
# Optional workflow_dispatch inputs:
#   target      — debug label only
#   ghcr_login  — true = scp GITHUB_TOKEN and `docker login ghcr.io` first
# -----------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'CVM 标识 (label, 仅 debug)'
        required: false
        type: string
        default: 'prod-cvm-1'
      ghcr_login:
        description: '先 docker login ghcr.io (用 GITHUB_TOKEN), 避免匿名被 denied'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: diag-prod
  cancel-in-progress: true

jobs:
  diag:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      # Deliver GHCR creds to CVM (only when ghcr_login=true). Mirrors
      # deploy-prod's approach. Writes two files to /tmp on the CVM;
      # the SSH step below reads them via sudo to login as root.
      - name: Deliver GHCR creds to CVM (only when ghcr_login=true)
        if: ${{ inputs.ghcr_login }}
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CVM_HOST }}
          username: ${{ vars.CVM_BOOTSTRAP_USER || 'ubuntu' }}
          key: ${{ secrets.CVM_BOOTSTRAP_SSH_KEY }}
          command_timeout: '2m'
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            printf '%s' "${GHCR_TOKEN}" > /tmp/ghcr_token.txt
            printf '%s' "${GHCR_USER}"  > /tmp/ghcr_user.txt
            chmod 600 /tmp/ghcr_token.txt /tmp/ghcr_user.txt
            ls -la /tmp/ghcr_token.txt /tmp/ghcr_user.txt

      # The whole test in one SSH step. Keep it self-contained: this is
      # the only thing the workflow does, so any failure here IS the
      # diagnostic result.
      - name: Configure mirror + restart docker + pull frontend
        env:
          DOCKER_REGISTRY: ${{ vars.DOCKER_REGISTRY }}
          GHCR_LOGIN: ${{ inputs.ghcr_login }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CVM_HOST }}
          username: ${{ vars.CVM_BOOTSTRAP_USER || 'ubuntu' }}
          key: ${{ secrets.CVM_BOOTSTRAP_SSH_KEY }}
          command_timeout: '15m'
          envs: DOCKER_REGISTRY,GHCR_LOGIN
          script: |
            set -e
            echo "diag-prod target=${{ inputs.target }}"
            echo "DOCKER_REGISTRY=${DOCKER_REGISTRY}"
            echo "GHCR_LOGIN=${GHCR_LOGIN}"
            echo ""

            # -----------------------------------------------------------------
            # 1. Backup current daemon.json
            # -----------------------------------------------------------------
            echo '======================================================'
            echo '## 1. backup current daemon.json'
            echo '======================================================'
            sudo cp /etc/docker/daemon.json "/etc/docker/daemon.json.bak.$(date +%s)"
            sudo ls -la /etc/docker/daemon.json*
            echo ''

            # -----------------------------------------------------------------
            # 2. Write a fresh daemon.json with the 4 known mirrors
            # -----------------------------------------------------------------
            echo '======================================================'
            echo '## 2. write new daemon.json (4 mirrors)'
            echo '======================================================'
            # Inline JSON via printf to dodge yaml block scalar indent rules.
            sudo mkdir -p /etc/docker
            sudo printf '%s' '{"registry-mirrors":["https://mirror.ccs.tencentyun.com","https://docker.m.daocloud.io","https://ghcr.m.daocloud.io","https://ghcr.nju.edu.cn"]}' > /etc/docker/daemon.json
            sudo python3 -c 'import json,sys;p=json.load(open("/etc/docker/daemon.json"));json.dump(p,open("/etc/docker/daemon.json","w"),indent=2)'
            echo '--- new daemon.json ---'
            sudo cat /etc/docker/daemon.json
            echo ''

            # -----------------------------------------------------------------
            # 3. Restart docker so the new mirror list takes effect
            # -----------------------------------------------------------------
            echo '======================================================'
            echo '## 3. restart docker + verify mirror list'
            echo '======================================================'
            sudo systemctl restart docker
            sleep 3
            systemctl is-active docker
            echo ''
            sudo docker info 2>&1 | grep -A6 'Registry Mirrors'
            echo ''

            # -----------------------------------------------------------------
            # 4. docker login (if requested)
            # -----------------------------------------------------------------
            if [ "${GHCR_LOGIN}" = "true" ]; then
              if [ -s /tmp/ghcr_user.txt ] && [ -s /tmp/ghcr_token.txt ]; then
                echo '======================================================'
                echo '## 4. docker login ghcr.io'
                echo '======================================================'
                sudo bash -c '
                  set -e
                  sudo docker login ghcr.io -u "$(cat /tmp/ghcr_user.txt)" --password-stdin < /tmp/ghcr_token.txt
                  rm -f /tmp/ghcr_user.txt /tmp/ghcr_token.txt
                '
                echo ''
              else
                echo 'WARNING: ghcr_login=true but /tmp/ghcr_*.txt missing — pull will likely be denied' >&2
              fi
            fi

            # -----------------------------------------------------------------
            # 5. Drop local frontend image so the pull is a real download
            # -----------------------------------------------------------------
            echo '======================================================'
            echo '## 5. rmi local frontend cache (force real pull)'
            echo '======================================================'
            sudo docker rmi -f ghcr.io/zhangyu528/type-any-language/english_frontend:v0.1.0 2>&1 || true
            echo ''

            # -----------------------------------------------------------------
            # 6. THE TEST: time docker pull through the mirror
            # -----------------------------------------------------------------
            echo '======================================================'
            echo '## 6. docker pull english_frontend:v0.1.0 (timed)'
            echo '======================================================'
            /usr/bin/time -f "REAL_SECONDS=%e" \
              sudo docker pull ghcr.io/zhangyu528/type-any-language/english_frontend:v0.1.0 \
              || echo '(pull failed)'
            echo ''
            echo '======================================================'
            echo '## done'
            echo '======================================================'
            echo 'If REAL_SECONDS is small (single digits to tens of seconds),'
            echo 'the mirror is working. If it crawls or hangs, the mirror is'
            echo 'not being used by docker daemon and we need to investigate.'