name: bootstrap-prod
run-name: bootstrap-prod-on-${{ inputs.host || 'auto' }}

# -----------------------------------------------------------------------
# One-time (BOOTSTRAP) host preparation for a new prod CVM.
#
# Lifecycle — 3 workflows, in this order:
#   bootstrap-prod  → ONE-TIME per host: provision deploy user + host prep
#   release-prod    → per release: build + push 3 images to GHCR
#   deploy-prod     → per release: pull images from GHCR + bring up stack
#
# What this workflow does (option B — fully automated user provisioning):
#   1. Verify CVM_HOST, CVM_BOOTSTRAP_SSH_KEY, DOCKER_REGISTRY exist.
#   2. Generate a fresh deploy SSH keypair on the runner (temporary).
#   3. SSH into the CVM as `ubuntu` (configurable) using
#      CVM_BOOTSTRAP_SSH_KEY, and:
#        - create the `deploy` user (idempotent)
#        - install NOPASSWD sudoers for /bin/mkdir + /bin/chown
#        - install Docker Engine + compose plugin (so deploy-prod can run)
#        - add `deploy` to the `docker` group (run docker without sudo)
#        - create ~/.ssh and install the generated deploy PUBLIC key
#          (prunes any prior gh-actions-deploy@ key first)
#        - sparse-checkout clone into /opt/type-any-language (owned by
#          deploy): ONLY docker-compose.yml + Makefile + ops/prod +
#          ops/lib.sh + */VERSION. Source code is excluded — prod images
#          are pulled from GHCR, not built locally on the CVM.
#   4. Write the generated deploy PRIVATE key back to GH Secret
#      CVM_SSH_KEY via `gh secret set` — authenticated with the GH_PAT
#      PAT, because GITHUB_TOKEN is NOT permitted to manage secrets.
#   5. SSH into the CVM as `deploy` (using the generated key) and run
#      `make prod-bootstrap` (preflight + .secrets/db_password + data dir).
#
# After this runs once, deploy-prod can log in directly as `deploy`
# via the now-auto-provisioned CVM_SSH_KEY.
#
# Required GH Secrets (you MUST add these manually, one-time):
#   CVM_HOST              — public IP / hostname of the prod CVM
#   CVM_BOOTSTRAP_SSH_KEY — SSH private key for the `ubuntu` (or root)
#                           user on the CVM. Used ONLY to provision the
#                           deploy user. This is the one key that cannot be
#                           bootstrapped (you must supply it).
#   GH_PAT                — a classic Personal Access Token with the
#                           `repo` scope. bootstrap uses it (via `gh
#                           secret set`) to write CVM_SSH_KEY back, because
#                           GITHUB_TOKEN is NOT allowed to manage secrets.
#                           This is a powerful credential — guard it.
# Auto-created by this workflow:
#   CVM_SSH_KEY           — deploy user's private key (written here)
# Required GH Variable:
#   DOCKER_REGISTRY       — registry namespace (single source of truth)
#
# Optional workflow_dispatch inputs:
#   host           — label only (debug)
#   bootstrap_user — login user used to provision deploy (default: ubuntu)
# -----------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      host:
        description: 'CVM 标识(label, 仅 debug)'
        required: false
        type: string
        default: 'prod-cvm-1'
      bootstrap_user:
        description: '用于首次创建 deploy 用户的登录用户(默认 ubuntu)'
        required: false
        type: string
        default: 'ubuntu'

permissions:
  contents: read

concurrency:
  group: bootstrap-prod
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment: prod
    env:
      DOCKER_REGISTRY: ${{ vars.DOCKER_REGISTRY }}
    steps:
      # -------- Pre-check: secrets / var --------
      - name: Verify required secrets / variable
        env:
          CVM_HOST: ${{ secrets.CVM_HOST }}
          CVM_BOOTSTRAP_SSH_KEY: ${{ secrets.CVM_BOOTSTRAP_SSH_KEY }}
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          : "${CVM_HOST:?GH Secret CVM_HOST 未配置}"
          : "${CVM_BOOTSTRAP_SSH_KEY:?GH Secret CVM_BOOTSTRAP_SSH_KEY 未配置(ubuntu 私钥)}"
          : "${GH_PAT:?GH Secret GH_PAT 未配置(classic PAT, repo 权限, 用于回写 CVM_SSH_KEY)}"
          : "${DOCKER_REGISTRY:?GH Variable DOCKER_REGISTRY 未配置}"
          echo "prechecks OK: CVM_HOST, CVM_BOOTSTRAP_SSH_KEY, GH_PAT, DOCKER_REGISTRY"

      # -------- Generate deploy keypair (runner-local, temporary) --------
      - name: Generate deploy keypair
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          ssh-keygen -t ed25519 -N "" \
            -f "$RUNNER_TEMP/keys/deploy_key" \
            -C "gh-actions-deploy@$(date +%s)"
          {
            echo "DEPLOY_PUBKEY<<EOF"
            cat "$RUNNER_TEMP/keys/deploy_key.pub"
            echo "EOF"
            echo "DEPLOY_PRIV_KEY<<EOF"
            cat "$RUNNER_TEMP/keys/deploy_key"
            echo "EOF"
          } >> "$GITHUB_ENV"
          echo "deploy keypair generated (temporary, runner-local)"

      # -------- Provision deploy user on CVM (as bootstrap_user) --------
      - name: Provision deploy user on CVM (as ${{ inputs.bootstrap_user }})
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CVM_HOST }}
          username: ${{ inputs.bootstrap_user }}
          key: ${{ secrets.CVM_BOOTSTRAP_SSH_KEY }}
          envs: DEPLOY_PUBKEY
          script: |
            set -e
            DEPLOY_USER=deploy
            if ! id -u "$DEPLOY_USER" >/dev/null 2>&1; then
              sudo useradd --disabled-password --create-home --shell /bin/bash "$DEPLOY_USER"
              echo "[bootstrap] created user $DEPLOY_USER"
            else
              echo "[bootstrap] user $DEPLOY_USER already exists"
            fi

            # NOPASSWD sudoers for the two commands make prod-bootstrap needs.
            echo "$DEPLOY_USER ALL=(ALL) NOPASSWD: /bin/mkdir, /bin/chown" \
              | sudo tee /etc/sudoers.d/deploy
            sudo chmod 440 /etc/sudoers.d/deploy
            sudo visudo -c

            # ── Install Docker Engine + compose plugin (one-time host prep) ──
            # deploy-prod cannot run without Docker, so bootstrap owns this.
            if ! command -v docker >/dev/null 2>&1; then
              echo "[bootstrap] installing Docker Engine..."
              sudo apt-get update -y
              sudo apt-get install -y ca-certificates curl gnupg git
              sudo install -m 0755 -d /etc/apt/keyrings
              sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
                -o /etc/apt/keyrings/docker.asc
              sudo chmod a+r /etc/apt/keyrings/docker.asc
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "$VERSION_CODENAME") stable" \
                | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
              sudo apt-get update -y
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io \
                docker-buildx-plugin docker-compose-plugin
              sudo systemctl enable --now docker
              echo "[bootstrap] Docker Engine installed"
            else
              echo "[bootstrap] Docker already present"
            fi

            # Let deploy run docker without sudo (required for `docker compose`).
            if ! id -nG "$DEPLOY_USER" | tr ' ' '\n' | grep -qx docker; then
              sudo usermod -aG docker "$DEPLOY_USER"
              echo "[bootstrap] added $DEPLOY_USER to docker group"
            else
              echo "[bootstrap] $DEPLOY_USER already in docker group"
            fi

            # ssh dir + authorized_keys (prune prior managed key, then install).
            sudo -u "$DEPLOY_USER" mkdir -p /home/$DEPLOY_USER/.ssh
            sudo -u "$DEPLOY_USER" chmod 700 /home/$DEPLOY_USER/.ssh
            AUTH=/home/$DEPLOY_USER/.ssh/authorized_keys
            sudo -u "$DEPLOY_USER" touch "$AUTH"
            sudo -u "$DEPLOY_USER" sed -i '/gh-actions-deploy@/d' "$AUTH" 2>/dev/null || true
            echo "$DEPLOY_PUBKEY" | sudo -u "$DEPLOY_USER" tee -a "$AUTH" >/dev/null
            sudo -u "$DEPLOY_USER" chmod 600 "$AUTH"
            sudo chown -R "$DEPLOY_USER:$DEPLOY_USER" /home/$DEPLOY_USER/.ssh
            echo "[bootstrap] deployed managed pubkey to $AUTH"

            # Sparse-checkout clone — only the files deploy needs on the CVM:
            #   docker-compose.yml + Makefile   (compose + make targets)
            #   ops/prod/*                      (deploy scripts + nginx.conf)
            #   ops/lib.sh                      (sourced by the prod scripts)
            #   */VERSION                       (image tag resolution —
            #                                     resolve_image_tag FAILS if
            #                                     these are missing)
            # Source code (backend/ frontend/ db/ Dockerfiles, cms/, scripts/)
            # is intentionally excluded: prod images are pulled from GHCR,
            # not built locally on the CVM.
            if [ ! -d /opt/type-any-language/.git ]; then
              sudo -u "$DEPLOY_USER" bash -c '
                set -e
                git clone --filter=blob:none \
                  https://github.com/zhangyu528/type-any-language.git \
                  /opt/type-any-language
                cd /opt/type-any-language
                git sparse-checkout set --no-cone \
                  docker-compose.yml \
                  Makefile \
                  ops/prod \
                  ops/lib.sh \
                  backend/VERSION \
                  frontend/VERSION \
                  db/VERSION
              '
              echo "[bootstrap] sparse-cloned repo (compose + ops/prod + version files only)"
            else
              echo "[bootstrap] repo already present"
            fi
            sudo chown -R "$DEPLOY_USER:$DEPLOY_USER" /opt/type-any-language

      # -------- Write deploy private key back to GH Secret --------
      - name: Write deploy private key to GH Secret CVM_SSH_KEY
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          gh secret set CVM_SSH_KEY --env prod --body "$DEPLOY_PRIV_KEY"
          echo "[bootstrap] CVM_SSH_KEY written (auto-provisioned via GH_PAT)"

      # -------- Run make prod-bootstrap as deploy --------
      - name: Run make prod-bootstrap as deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CVM_HOST }}
          username: deploy
          key: ${{ env.DEPLOY_PRIV_KEY }}
          envs: DOCKER_REGISTRY
          script: |
            set -e
            cd /opt/type-any-language
            echo "[bootstrap] pulling latest repo"
            git pull
            if [ -z "$DOCKER_REGISTRY" ]; then
              echo "::error::DOCKER_REGISTRY was not forwarded to CVM"
              exit 1
            fi
            echo "[bootstrap] DOCKER_REGISTRY=$DOCKER_REGISTRY"
            make prod-bootstrap
            echo "[bootstrap] done — CVM is now ready for deploy-prod workflow"

      # -------- Clean up temp key --------
      - name: Clean up temp key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
