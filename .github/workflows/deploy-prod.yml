name: deploy-prod
run-name: deploy-prod-${{ inputs.version || 'auto' }}

# Roll out a release to the prod CVM.
#
# Trigger: workflow_dispatch ONLY. The operator runs this manually
# after release-prod completes successfully, picking the version
# to deploy. There is no auto-trigger (no workflow_run) — deploy is
# a deliberate, auditable action.
#
# Manual trigger (workflow_dispatch) supports two use cases:
#   1. Deploy the just-released version: pick "auto" — the workflow
#      resolves the latest published release (via `gh release list`)
#      and deploys it. If no release exists yet, it falls back to the
#      default branch head.
#   2. Rollback: pick a specific version (e.g. v0.1.0) from the
#      dropdown. The option list is STATIC (GH workflow_dispatch
#      choice inputs can't be populated dynamically) — add new
#      versions here by hand as you cut releases.
#
# Pair with the Makefile target `make prod-deploy` which is THE
# go-live step (doctor pre + lifecycle restart + doctor post).
#
# Required GH Secrets (env: prod):
#   CVM_HOST              — public IP / hostname of the prod CVM
#   CVM_BOOTSTRAP_SSH_KEY — SSH private key for the `ubuntu` (or root)
#                           user on the CVM. deploy-prod logs in as this
#                           user and runs the deploy via `sudo -u deploy`.
#
# Why split from release-prod.yml (rather than one combined workflow):
#   - Release = artifact creation; deploy = go-live. Different
#     concerns, different failure modes. If deploy fails, release
#     still succeeded — just re-run deploy.
#   - Manual rollback needs a dedicated deploy trigger without
#     re-running release (otherwise you'd accidentally publish a
#     new tag).
#   - Different secrets: release uses GITHUB_TOKEN (GHCR push), deploy
#     uses CVM_BOOTSTRAP_SSH_KEY (logs in as the bootstrap user, then
#     sudo -u deploy). No registry username/password needed — GHCR uses
#     the built-in GITHUB_TOKEN (packages: write).

on:
  workflow_dispatch:
    inputs:
      version:
        description: '要部署的版本。选 "auto" 部署最新的已发布 release；或选具体版本回滚。每发一个新版本，需手动在下方 options 追加一项。'
        required: true
        type: choice
        default: auto
        options:
          - auto
          - v0.1.0
      bootstrap_user:
        description: 'Login user used to run the deploy via sudo -u deploy (default: ubuntu)'
        required: false
        type: string
        default: 'ubuntu'

permissions:
  contents: read   # only checkout (read-only), no commits

concurrency:
  # Two deploys at once would race on the same CVM. Queue them serially.
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Use prod environment for access to CVM_HOST / CVM_BOOTSTRAP_SSH_KEY secrets
    # AND for optional required-reviewer approval on manual deploys.
    environment: prod
    # workflow_dispatch only — no auto trigger. The operator explicitly
    # runs this after release-prod completes (decide what version
    # to ship, run deploy, verify on CVM).
    steps:
      - name: Discover recent successful releases
        # Informational helper (does NOT drive the dropdown — GH
        # workflow_dispatch choice inputs are static and must be edited
        # by hand). Lists recent release-prod runs + git tags so the
        # operator can see what versions exist and which to pick.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== 最近成功的 release-prod runs (按时间倒序) ==="
          gh run list \
              --workflow=release-prod.yml \
              --status=success \
              --limit=10 \
              --json databaseId,displayTitle,headBranch,createdAt,conclusion \
              --jq '.[] | "\(.createdAt)  run=\(.databaseId)  title=\(.displayTitle)"'
          echo ""
          echo "=== 当前 git tags (按版本倒序) ==="
          git tag --sort=-v:refname | head -20
        continue-on-error: true   # listing is informational; don't fail the run

      - name: Verify DOCKER_REGISTRY is set
        env:
          DOCKER_REGISTRY: ${{ vars.DOCKER_REGISTRY }}
        run: |
          if [ -z "$DOCKER_REGISTRY" ]; then
            echo "::error::GH Variable DOCKER_REGISTRY 未配置"
            echo "  → GH repo → Settings → Environments → prod → Variables → New"
            echo "  → Name: DOCKER_REGISTRY, Value: ghcr.io/zhangyu528/type-any-language"
            exit 1
          fi
          echo "DOCKER_REGISTRY=$DOCKER_REGISTRY (source=GH Variable)"

      - name: Resolve deploy version
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SELECTED: ${{ inputs.version }}
        run: |
          set -e
          if [ "$SELECTED" = "auto" ]; then
            echo "version input = auto → resolving latest published release"
            tag=$(gh release list --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null || true)
            if [ -z "$tag" ]; then
              echo "::warning::未找到已发布的 release，将回退到默认分支最新提交"
              tag=""
            else
              echo "resolved latest release tag = $tag"
            fi
          else
            echo "version input = $SELECTED (explicit)"
            tag="$SELECTED"
          fi
          echo "DEPLOY_TAG=$tag" >> "$GITHUB_OUTPUT"

      - name: SSH to CVM and deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_TAG: ${{ steps.resolve.outputs.DEPLOY_TAG }}
        with:
          host: ${{ secrets.CVM_HOST }}
          username: ${{ inputs.bootstrap_user }}
          key: ${{ secrets.CVM_BOOTSTRAP_SSH_KEY }}
          envs: DOCKER_REGISTRY,DEPLOY_TAG
          script: |
            set -e
            sudo -u deploy bash -lc '
              export DOCKER_REGISTRY="'"$DOCKER_REGISTRY"'"
              export DEPLOY_TAG="'"$DEPLOY_TAG"'"
              set -e
              cd /opt/type-any-language

              if [ -z "$DEPLOY_TAG" ]; then
                # auto + no release found → deploy latest branch head
                echo "[deploy] auto: no release resolved, pulling latest branch head"
                git pull
              else
                # Deploy / rollback: check out the chosen version tag
                echo "[deploy] checking out $DEPLOY_TAG"
                git fetch --tags
                git checkout "$DEPLOY_TAG"
              fi

              # Verify DOCKER_REGISTRY was injected (defense in depth — CVM also checks)
              if [ -z "$DOCKER_REGISTRY" ]; then
                echo "::error::DOCKER_REGISTRY was not forwarded to CVM via SSH env"
                echo "  -> Check appleboy/ssh-action envs: directive in this workflow"
                exit 1
              fi
              echo "[deploy] DOCKER_REGISTRY=$DOCKER_REGISTRY"

              # THE go-live step. doctor pre + lifecycle restart + doctor post.
              echo "[deploy] running make prod-deploy"
              make prod-deploy
            '