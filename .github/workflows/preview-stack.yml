name: preview-stack
# 任何人有 repo write 权限就能触发。运行 ~45 分钟后自动终止,
# 公开 URL 跟 run 绑定,run 结束 URL 失效。
# 单 job 架构:tunnel 进程和 keep-alive 在同一 runner,
# 避免 job 结束后 GitHub kill 进程导致 URL 失效。

on:
  # 只用手动触发。在 Actions UI 选分支 → Run workflow,或 CLI:
  #   gh workflow run preview-stack.yml -r <branch>
  workflow_dispatch:
    inputs:
      branch:
        description: '要预览的分支(留空用触发时的分支)'
        required: false
        default: ''

permissions:
  contents: read
  issues: write

jobs:
  # ============================================================
  # preview: 单 job。build + 启动服务 + 拿 URL + hold tunnel ~40 分钟。
  # environment.url 让 "View deployment" 按钮在 tunnel step 完成后
  # 即刻出现在 run overview,无需等 job 结束。
  # ============================================================
  preview:
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.tunnel.outputs.url }}
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: previewpw
          POSTGRES_DB: english_learning
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:previewpw@localhost:5432/english_learning
      ALLOWED_ORIGINS: '*'
      PYTHONUNBUFFERED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Wait for postgres
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U postgres; then
              echo "postgres ready after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Run DB migrations
        run: bash ./db/scripts/migrate.sh

      - name: Import CMS content
        run: bash ./db/scripts/import_staging.sh all

      - name: Install frontend deps
        working-directory: frontend
        # 用 `npm install` 不用 `npm ci`:CI 默认用 npm ci 但 preview 场景下
        # 更宽容(自动同步 lockfile)。master 上有时 package.json 加了依赖
        # 但没跑 `npm install` 同步 lockfile,导致 npm ci 直接 401 失败。
        run: npm install --no-audit --no-fund --loglevel=warn

      - name: Build frontend
        working-directory: frontend
        env:
          # GITHUB_PAGES=1 → next.config.js 走 output: 'export' 路径(static export)
          # NEXT_PUBLIC_DEMO_MODE=true → client JS 走 mock data,不调真 backend
          # NEXT_PUBLIC_API_URL='' → 相对 URL,nginx 反代 /api/* 到 uvicorn
          GITHUB_PAGES: '1'
          NEXT_PUBLIC_DEMO_MODE: 'true'
          NEXT_PUBLIC_API_URL: ''
        run: npm run build

      - name: Get current month (cache key rotation)
        id: month
        # 用月份做 cache key 的一部分 → 每月自动 re-download 一次,保证 binary 新鲜
        # 同一月内 cache hit 跳过 30MB 下载
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Cache cloudflared binary
        id: cache-cf
        uses: actions/cache@v4
        with:
          path: /tmp/cloudflared
          # key 固定 → 同月内所有 run 共享 cache
          # 不带 branch 信息 → feat/master 都用同一份
          # restore-keys prefix → 新月份 cache miss 时,fallback 用上月 cache(冷启动不会卡死)
          key: cloudflared-${{ runner.os }}-${{ steps.month.outputs.month }}
          restore-keys: |
            cloudflared-${{ runner.os }}-

      - name: Install cloudflared
        if: steps.cache-cf.outputs.cache-hit != 'true'
        run: |
          # 缓存未命中 → 从 latest 下载。月份会自动切换,不用锁版本。
          curl -fsSL -o /tmp/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared

      - name: Verify cloudflared
        run: /tmp/cloudflared --version

      - name: Start backend
        working-directory: backend
        env:
          ALLOWED_ORIGINS: '*'
        run: |
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 \
            > /tmp/backend.log 2>&1 &
          echo "backend PID: $!"
          for i in $(seq 1 20); do
            if curl -fsS -o /dev/null http://localhost:8000/api/content/catalog; then
              echo "backend ready after ${i}s"
              break
            fi
            sleep 1
          done

      - name: Install & start nginx
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx > /dev/null
          cat > /tmp/nginx.conf <<EOF
          user runner;
          events { worker_connections 1024; }
          http {
            include /etc/nginx/mime.types;
            server {
              listen 4000;
              root $GITHUB_WORKSPACE/frontend/out;
              index index.html;
              location / {
                try_files \$uri \$uri/ /index.html;
              }
              location /api/ {
                proxy_pass http://localhost:8000;
                proxy_set_header Host \$host;
                proxy_set_header X-Real-IP \$remote_addr;
                proxy_http_version 1.1;
              }
            }
          }
          EOF
          sudo cp /tmp/nginx.conf /etc/nginx/nginx.conf
          sudo nginx -t
          sudo nginx
          sleep 2
          curl -fsS -o /dev/null -w "nginx status: %{http_code}\n" http://localhost:4000/

      - name: Start cloudflared tunnel
        id: tunnel
        run: |
          nohup /tmp/cloudflared tunnel --url http://localhost:4000 \
            > /tmp/tunnel.log 2>&1 &
          echo "tunnel PID: $!"
          for i in $(seq 1 30); do
            URL=$(grep -oE "https://[a-z0-9-]+\.trycloudflare\.com" /tmp/tunnel.log | head -1)
            if [ -n "$URL" ]; then
              echo "url=$URL" >> "$GITHUB_OUTPUT"
              echo "URL ready after ${i}s"
              break
            fi
            sleep 1
          done
          if [ -z "$URL" ]; then
            echo "::error::Tunnel URL not found"
            cat /tmp/tunnel.log
            exit 1
          fi

      - name: Post preview URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          URL="${{ steps.tunnel.outputs.url }}"
          BRANCH="${{ inputs.branch || github.ref_name }}"
          RUN_NUM="${{ github.run_number }}"
          echo "::notice title=🌐 Preview URL::$URL"
          {
            echo "# 🌐 Preview URL"
            echo ""
            echo "## [🔗 $URL]($URL)"
            echo ""
            echo "| 字段 | 值 |"
            echo "|---|---|"
            echo "| **URL** | [$URL]($URL) |"
            echo "| Branch | \`$BRANCH\` |"
            echo "| Run | #$RUN_NUM |"
            echo ""
            echo "### Stack"
            echo "- nginx :4000 — 静态 + /api/* 反代到 uvicorn"
            echo "- uvicorn :8000 — FastAPI 真 backend"
            echo "- postgres :5432 — service container"
            echo "- cloudflared — 出站隧道"
            echo ""
            echo "### 怎么停"
            echo "Actions tab → 选本 run → Cancel workflow"
          } >> "$GITHUB_STEP_SUMMARY"

          # 在复用的 preview issue 下评论 + @mention contributors
          ISSUE_NUM=$(gh issue list --repo ${{ github.repository }} \
            --label "preview" --state open \
            --json number -q '.[0].number' 2>/dev/null || echo "")

          if [ -n "$ISSUE_NUM" ]; then
            # 查询 repo contributors,过滤掉 bot 账号
            MENTIONS=$(gh api repos/${{ github.repository }}/contributors \
              --paginate --jq '.[].login' 2>/dev/null | \
              grep -viE 'claude|bot|github-actions|dependabot' | \
              head -10 | \
              sed 's/^/@/' | tr '\n' ' ')

            gh issue comment "$ISSUE_NUM" --repo ${{ github.repository }} \
              --body "🌐 **Preview ready** (run #${RUN_NUM}, \`${BRANCH}\`)

          **URL**: [$URL]($URL)

          有效期 ~40 分钟。

          ${MENTIONS}"
          fi

      - name: Keep tunnel alive
        run: |
          URL="${{ steps.tunnel.outputs.url }}"
          echo "Holding tunnel alive for ~40 minutes: $URL"
          END=$((SECONDS + 2400))
          while [ $SECONDS -lt $END ]; do
            echo "[$(date +%H:%M:%S)] tunnel alive: $URL"
            sleep 60
          done
          echo "Keep alive window ended (40 min)."
