events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # The backend + frontend containers are exposed on host
    # 127.0.0.1:8000 / 127.0.0.1:3000 (host-only, not exposed to the
    # public internet). System nginx reverse-proxies from :80 to
    # those host-side ports. Earlier revisions pointed at
    # `backend:8000` / `frontend:3000` (docker-internal DNS), which
    # only worked when nginx itself was running inside compose.
    # When system nginx runs the show, it must use 127.0.0.1.

    upstream backend {
        server 127.0.0.1:8000;
    }

    upstream frontend {
        server 127.0.0.1:3000;
    }

    server {
        listen 80;
        server_name localhost;

        # API requests
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Audio is NOT served from this nginx. The frontend reads
        # sentence.audio_url (a full Tencent Cloud COS URL baked into
        # the db image at build time) and the browser streams directly
        # from COS — no /audio path on this server.

        # Frontend static / Next.js
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
        }
    }
}
