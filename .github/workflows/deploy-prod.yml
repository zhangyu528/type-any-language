name: deploy-prod
run-name: deploy-prod-${{ inputs.version || 'auto' }}

# Roll out a release to the prod CVM.
#
# Trigger: workflow_dispatch ONLY. The operator runs this manually
# after release-prod completes successfully, picking the version
# to deploy. There is no auto-trigger (no workflow_run) — deploy is
# a deliberate, auditable action.
#
# Manual trigger (workflow_dispatch) supports two use cases:
#   1. Deploy the just-released version: pick "auto" — the workflow
#      resolves the latest git tag / GitHub release (via the GitHub API
#      on the runner, which has good network) and deploys it. The CVM
#      itself never fetches from github.com (cross-continental SSL timeouts).
#   2. Rollback: pick a specific version (e.g. v0.1.0) from the
#      dropdown. The option list is STATIC (GH workflow_dispatch
#      choice inputs can't be populated dynamically) — add new
#      versions here by hand as you cut releases.
#
# Version model (full cleanup, 2026-08-06): the single source of truth
# for the deployed version is the git TAG created by release-prod (which
# also publishes a GitHub release). There are NO per-segment VERSION
# files anymore — the resolved tag is delivered to the CVM as the
# IMAGE_TAG env var, which resolve_image_tag() prefers over any file.
#
# Pair with the Makefile target `make prod-deploy` which is THE
# go-live step (doctor pre + lifecycle restart + doctor post).
#
# Required GH Secrets (env: prod):
#   CVM_HOST              — public IP / hostname of the prod CVM
#   CVM_BOOTSTRAP_SSH_KEY — SSH private key for the `ubuntu` (or root)
#                           user on the CVM. deploy-prod logs in as this
#                           user and runs the deploy via `sudo -u deploy`.
#
# Why split from release-prod.yml (rather than one combined workflow):
#   - Release = artifact creation; deploy = go-live. Different
#     concerns, different failure modes. If deploy fails, release
#     still succeeded — just re-run deploy.
#   - Manual rollback needs a dedicated deploy trigger without
#     re-running release (otherwise you'd accidentally publish a
#     new tag).
#   - Different secrets: release uses GITHUB_TOKEN (GHCR push), deploy
#     uses CVM_BOOTSTRAP_SSH_KEY (logs in as the bootstrap user, then
#     sudo -u deploy). No registry username/password needed — GHCR uses
#     the built-in GITHUB_TOKEN (packages: write).

on:
  workflow_dispatch:
    inputs:
      version:
        description: '要部署的版本。选 "auto" 部署最新的已发布 release；或选具体版本回滚。每发一个新版本，需手动在下方 options 追加一项。'
        required: true
        type: choice
        default: auto
        options:
          - auto
          - v0.1.0

permissions:
  contents: read   # only checkout (read-only), no commits

concurrency:
  # Two deploys at once would race on the same CVM. Queue them serially.
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Use prod environment for access to CVM_HOST / CVM_BOOTSTRAP_SSH_KEY secrets
    # AND for optional required-reviewer approval on manual deploys.
    environment: prod
    # workflow_dispatch only — no auto trigger. The operator explicitly
    # runs this after release-prod completes (decide what version
    # to ship, run deploy, verify on CVM).
    steps:
      - name: Checkout repo
        # Needed so the runner has the prod scripts (for the tar→scp step)
        # and so `gh run list` can resolve the base repo from git context.
        uses: actions/checkout@v4

      - name: Discover recent successful releases
        # Informational helper (does NOT drive the dropdown — GH
        # workflow_dispatch choice inputs are static and must be edited
        # by hand). Lists recent release-prod runs + git tags so the
        # operator can see what versions exist and which to pick.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "=== 最近成功的 release-prod runs (按时间倒序) ==="
          gh run list \
              --workflow=release-prod.yml \
              --status=success \
              --limit=10 \
              --json databaseId,displayTitle,headBranch,createdAt,conclusion \
              --jq '.[] | "\(.createdAt)  run=\(.databaseId)  title=\(.displayTitle)"'
          echo ""
          echo "=== 已有 git tags (按版本倒序) ==="
          gh api "repos/$REPO/tags" --jq '.[].name' 2>/dev/null | head -20 || true
        continue-on-error: true   # listing is informational; don't fail the run

      - name: Verify DOCKER_REGISTRY is set
        env:
          DOCKER_REGISTRY: ${{ vars.DOCKER_REGISTRY }}
        run: |
          if [ -z "$DOCKER_REGISTRY" ]; then
            echo "::error::GH Variable DOCKER_REGISTRY 未配置"
            echo "  → GH repo → Settings → Environments → prod → Variables → New"
            echo "  → Name: DOCKER_REGISTRY, Value: ghcr.io/zhangyu528/type-any-language"
            exit 1
          fi
          echo "DOCKER_REGISTRY=$DOCKER_REGISTRY (source=GH Variable)"

      - name: Resolve deploy version
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SELECTED: ${{ inputs.version }}
        run: |
          set -e
          if [ "$SELECTED" = "auto" ]; then
            # Full cleanup: the version IS the git tag created by release-prod
            # (which also publishes a GitHub release). Resolve the LATEST
            # release/tag on the RUNNER (good network). The CVM itself never
            # fetches from github.com (cross-continental SSL timeouts) — it
            # only receives the tag as the IMAGE_TAG env var via SSH.
            echo "version = auto → resolving latest release/tag on runner"
            tag=$(gh release list --repo "$REPO" --limit 1 --json tagName --jq '.[0].tagName' 2>/dev/null)
            if [ -z "$tag" ]; then
              # Fallback to the latest git tag if no GitHub release exists yet.
              tag=$(gh api "repos/$REPO/tags?per_page=1" --jq '.[0].name' 2>/dev/null)
            fi
            if [ -z "$tag" ]; then
              echo "::error::auto 模式找不到任何 release/tag —— 先跑一次 release-prod 创建 tag+release"
              echo "  → 或在 dropdown 里选一个具体版本 (如 v0.1.0)"
              exit 1
            fi
            echo "resolved latest version = $tag"
          else
            echo "version input = $SELECTED (explicit)"
            tag="$SELECTED"
          fi
          echo "DEPLOY_TAG=$tag" >> "$GITHUB_OUTPUT"

      - name: Package + copy latest prod scripts to CVM
        # The CVM NEVER fetches from github.com (cross-continental SSL
        # timeouts) and deploy no longer runs `git pull`, so script fixes
        # can only reach the CVM if the RUNNER pushes them. We tar the
        # needed files (the runner has the latest via checkout) and scp
        # them to /tmp on the CVM; the next SSH step unpacks them in place.
        #
        # ALSO pushes /tmp/ghcr_user and /tmp/ghcr_token, which the next
        # SSH step feeds to `docker login` to bypass GHCR's anonymous-pull
        # rate limit. We push them as files (not via appleboy's `envs:`
        # forwarding, which silently dropped GHCR_USER for unrelated
        # reasons) and the values never appear in appleboy's `script:`
        # string (which doesn't accept GHA expression interpolation anyway).
        # GITHUB_TOKEN is run-scoped, so any straggler in /tmp is harmless.
        env:
          CVM_HOST: ${{ secrets.CVM_HOST }}
          CVM_USER: ${{ vars.CVM_BOOTSTRAP_USER || 'ubuntu' }}
          CVM_KEY: ${{ secrets.CVM_BOOTSTRAP_SSH_KEY }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          tar czf /tmp/prod-deploy.tar.gz -C "${{ github.workspace }}" \
            ops/prod ops/lib.sh Makefile docker-compose.yml

          # Sanity-check the token: an empty GITHUB_TOKEN would let docker
          # login fall back to anonymous, which is exactly the bug we are
          # trying to fix. Fail loudly instead.
          if [ -z "$GHCR_TOKEN" ]; then
            echo "::error::GHCR_TOKEN (secrets.GITHUB_TOKEN) is empty — can't authenticate to ghcr.io"
            exit 1
          fi
          echo "[runner] GHCR user=$GHCR_USER token_len=${#GHCR_TOKEN}"

          printf '%s\n' "$CVM_KEY" > "$RUNNER_TEMP/cvm_key"
          chmod 600 "$RUNNER_TEMP/cvm_key"

          # Stage GHCR creds on disk, scp them in the same session as the
          # prod scripts tarball (saves an SSH handshake).
          printf '%s' "$GHCR_USER" > /tmp/ghcr_user
          printf '%s' "$GHCR_TOKEN" > /tmp/ghcr_token
          chmod 600 /tmp/ghcr_user /tmp/ghcr_token
          scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -i "$RUNNER_TEMP/cvm_key" \
            /tmp/prod-deploy.tar.gz /tmp/ghcr_user /tmp/ghcr_token \
            "$CVM_USER@$CVM_HOST:/tmp/"

          # Wipe runner-side creds immediately.
          rm -f /tmp/ghcr_user /tmp/ghcr_token "$RUNNER_TEMP/cvm_key"
          echo "[runner] delivered prod-deploy.tar.gz + ghcr creds -> CVM:/tmp"

      - name: SSH to CVM and deploy
        uses: appleboy/ssh-action@v1.0.3
        env:
          # FIX: DOCKER_REGISTRY must be declared here too — appleboy only
          # forwards env vars that actually exist in THIS step's `env:` block.
          # It was listed in `envs:` before but never set here, so it arrived
          # empty on the CVM ("DOCKER_REGISTRY was not forwarded" error).
          DOCKER_REGISTRY: ${{ vars.DOCKER_REGISTRY }}
          # Full cleanup: forward the resolved tag as IMAGE_TAG. The CVM's
          # resolve_image_tag() prefers IMAGE_TAG over any VERSION file, so
          # no VERSION file is written/pinned on the CVM anymore.
          IMAGE_TAG: ${{ steps.resolve.outputs.DEPLOY_TAG }}
          # NOTE: GHCR credentials are NOT declared here. Putting them in
          # step env + envs: caused two failures:
          #   (a) appleboy/ssh-action silently dropped GHCR_USER ("username
          #       is empty" from docker login)
          #   (b) inline the secrets.GITHUB_TOKEN expression in appleboy's
          #       `script:` triggers a YAML parser error "An expression
          #       was expected" — appleboy's `script:` is NOT a GitHub
          #       Actions `run:` and does not allow GHA interpolation.
          # Solution: the previous step scp'd /tmp/ghcr_user and
          # /tmp/ghcr_token (plain user + token). This step feeds them
          # to `docker login` — no docker login input needs to be
          # inlined, no GHA expression in script.
        with:
          host: ${{ secrets.CVM_HOST }}
          username: ${{ vars.CVM_BOOTSTRAP_USER || 'ubuntu' }}
          key: ${{ secrets.CVM_BOOTSTRAP_SSH_KEY }}
          # Generous command timeout: a cold `docker compose pull` of 4 images
          # from GHCR on the CVM can take several minutes. The earlier
          # "Run Command Timeout" was caused by a MISSING nginx tag making the
          # pull retry forever — now fixed — but keep this headroom so a merely
          # SLOW (not stuck) pull still finishes.
          command_timeout: '1800s'
          envs: DOCKER_REGISTRY,IMAGE_TAG
          script: |
            set -e

            # Deliver the latest prod scripts pushed by the runner (previous
            # step scp'd /tmp/prod-deploy.tar.gz). The CVM never reaches
            # github.com, so this is the ONLY way script fixes get applied.
            sudo rm -rf /opt/type-any-language/ops/prod /opt/type-any-language/ops/lib.sh
            sudo tar xzf /tmp/prod-deploy.tar.gz -C /opt/type-any-language
            sudo chown -R deploy:deploy \
              /opt/type-any-language/ops \
              /opt/type-any-language/Makefile \
              /opt/type-any-language/docker-compose.yml
            rm -f /tmp/prod-deploy.tar.gz

            # Login CVM to ghcr.io to bypass anonymous-pull rate limit. The runner
            # scp'd /tmp/ghcr_user and /tmp/ghcr_token so we can run docker
            # login here without depending on appleboy's env forwarding
            # (which silently dropped GHCR_USER) and without putting
            # secrets.GITHUB_TOKEN into appleboy's `script:` (which doesn't
            # accept GHA expression interpolation). Run as root because docker
            # login touches /root/.docker/config.json. Files are wiped
            # immediately after login; GITHUB_TOKEN is run-scoped so any
            # straggler is harmless.
            if [ -s /tmp/ghcr_user ] && [ -s /tmp/ghcr_token ]; then
              sudo -n bash -lc '
                set -e
                # Run login from a writable CWD; docker login reads
                # /tmp/ghcr_token via stdin.
                docker login ghcr.io -u "$(cat /tmp/ghcr_user)" --password-stdin < /tmp/ghcr_token
                rm -f /tmp/ghcr_user /tmp/ghcr_token
                echo "[cvm] docker login ghcr.io OK"
              '
            else
              echo "::warning::ghcr creds missing on CVM - will pull anonymously (may hit GHCR rate limit)"
            fi

            sudo -u deploy bash -lc '
              export DOCKER_REGISTRY="'"$DOCKER_REGISTRY"'"
              export IMAGE_TAG="'"$IMAGE_TAG"'"
              set -e
              cd /opt/type-any-language

              # defense in depth: ensure prod scripts are executable
              chmod +x ops/prod/*.sh

              if [ -z "$IMAGE_TAG" ]; then
                echo "::error::IMAGE_TAG 为空, 无法确定要部署的版本"
                exit 1
              fi

              # Verify DOCKER_REGISTRY was injected (defense in depth — CVM also checks)
              if [ -z "$DOCKER_REGISTRY" ]; then
                echo "::error::DOCKER_REGISTRY was not forwarded to CVM via SSH env"
                echo "  -> Check appleboy/ssh-action envs: directive in this workflow"
                exit 1
              fi
              echo "[deploy] IMAGE_TAG=$IMAGE_TAG  DOCKER_REGISTRY=$DOCKER_REGISTRY"

              # THE go-live step. doctor pre + lifecycle restart + doctor post.
              echo "[deploy] running make prod-deploy"
              make prod-deploy
            '