name: type-any-language-dev

# ---------------------------------------------------------------------------
# Development docker-compose for type-any-language.
#
# Sole purpose: run the dev postgres (`english_dev` / `devpw` /
# `english_dev`) on the host so the host-native dev loop (uvicorn +
# `next dev` on the host) has a database to talk to. There are no
# other services in this file — backend and frontend run on the host
# via `dev run` (dev-cli/run.js), not in containers.
#
# One db per dev host (single-tenant). Data is bind-mounted to
# ./.docker-postgres-data/ (gitignored) so container recreate preserves
# state, and the data is visible on the host for backup / inspection.
#
# First-time data: run `dev run` on the host (smart-import is part of the run preflight) (or
# `python -m importer all` directly). The dev wrapper UPSERTs vocab +
# sentences, then immediately re-runs migrations so rerunnable backfills
# see the imported rows. No backend restart is required.
# ---------------------------------------------------------------------------

services:
  # -------------------------------------------------------------------------
  # db — local postgres for dev
  # -------------------------------------------------------------------------
  db:
    image: postgres:15-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-type-any-language}-db
    environment:
      POSTGRES_USER: english_dev
      POSTGRES_PASSWORD: devpw
      POSTGRES_DB: english_dev
    ports:
      # Expose to host for tooling (psql, python3 -m importer, uvicorn).
      - "5432:5432"
    volumes:
      # Persistent data — bind-mounted to ./.docker-postgres-data/ (i.e. dev-cli/.docker-postgres-data/, gitignored)
      # so container recreate preserves state, and the data is visible
      # on the host for backup / inspection.
      - ./.docker-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U english_dev -d english_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
