name: diag-prod
run-name: diag-prod-on-${{ inputs.target || 'auto' }}

# -----------------------------------------------------------------------
# Diagnostic-only workflow: SSH into the prod CVM and run one or more
# inspection commands. Pure read-side — never mutates CVM state, never
# touches GHCR, never restarts services. Safe to re-run.
#
# Purpose: when deploy-prod fails or behaves strangely (e.g. the
# `Downloading X MB` retry storm we just hit), use this workflow to
# collect ground truth from the CVM without having to SSH by hand.
#
# Each diagnostic is gated by an input boolean. Pass all=true to run
# everything in one go, or pick individual checks to keep logs focused.
#
# Required GH Secrets / Variables (same as deploy-prod / bootstrap-prod):
#   secrets.CVM_HOST, secrets.CVM_BOOTSTRAP_SSH_KEY
#   vars.DOCKER_REGISTRY  (printed in the report header, not consumed)
#
# Optional workflow_dispatch inputs:
#   target          — debug label only
#   all             — run every diagnostic (overrides the booleans below)
#   check_config    — daemon.json / hosts.toml / mirror registry mirrors
#   check_speed     — curl speed tests against ghcr.io and 3 mirrors
#   check_digest    — manifest digest parity (mirror returns the same blob)
#   pull_frontend   — `docker pull english_frontend:v0.1.0` end-to-end
#   pull_db         — `docker pull english_db:v0.1.0` (largest image, worst case)
# -----------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'CVM 标识 (label, 仅 debug)'
        required: false
        type: string
        default: 'prod-cvm-1'
      all:
        description: '跑全部诊断 (覆盖下面的 checkbox)'
        required: false
        type: boolean
        default: false
      check_config:
        description: '检查 daemon.json + hosts.toml + mirror 配置'
        required: false
        type: boolean
        default: true
      check_speed:
        description: 'curl 测速 (ghcr.io 直连 + 3 个 mirror)'
        required: false
        type: boolean
        default: true
      check_digest:
        description: 'manifest digest 一致性 (mirror 是否纯净代理)'
        required: false
        type: boolean
        default: true
      pull_frontend:
        description: 'docker pull english_frontend:v0.1.0 (端到端)'
        required: false
        type: boolean
        default: false
      pull_db:
        description: 'docker pull english_db:v0.1.0 (端到端, 最大镜像)'
        required: false
        type: boolean
        default: false
      apply_mirror:
        description: '将 ghcr.io mirror 写进 CVM daemon.json + restart docker (会修改 CVM 配置)'
        required: false
        type: boolean
        default: false
      verify_pull:
        description: '应用 mirror 后再跑一次 docker pull frontend (端到端验证 mirror 加速效果)'
        required: false
        type: boolean
        default: false
      ghcr_login:
        description: '先 docker login ghcr.io 再跑 pull (避免匿名被 GHCR 限流/拒绝; 复刻 deploy-prod 的做法)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: diag-prod
  cancel-in-progress: true

jobs:
  diag:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      # When ghcr_login=true: write GHCR creds to two files on the CVM via
      # SSH stdin. Mirrors deploy-prod's approach (deploy-prod.yml:158-181)
      # — it does the same thing so `docker login` in the SSH step that
      # follows can read them via stdin. The runner-to-CVM ssh channel is
      # already open for the diagnostic step, so we just piggy-back here.
      # We avoid passing the token through envs/scripts because appleboy
      # logs both to its GHA step output and we don't want a secret in the
      # run log even briefly.
      - name: Deliver GHCR creds to CVM (only when ghcr_login=true)
        if: ${{ inputs.ghcr_login }}
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CVM_HOST }}
          username: ${{ vars.CVM_BOOTSTRAP_USER || 'ubuntu' }}
          key: ${{ secrets.CVM_BOOTSTRAP_SSH_KEY }}
          command_timeout: '2m'
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            # Write token + user to /tmp, mode 600, owned by ubuntu.
            # The diagnostic step's `sudo docker login` reads them via stdin.
            printf '%s' "${GHCR_TOKEN}" > /tmp/ghcr_token.txt
            printf '%s' "${GHCR_USER}"  > /tmp/ghcr_user.txt
            chmod 600 /tmp/ghcr_token.txt /tmp/ghcr_user.txt
            ls -la /tmp/ghcr_token.txt /tmp/ghcr_user.txt

      - name: SSH to CVM and run diagnostics
        uses: appleboy/ssh-action@v1.0.3
        env:
          # appleboy/ssh-action only forwards env vars declared in THIS
          # step's env block (mirrors the deploy-prod gotcha). All booleans
          # below come from workflow_dispatch inputs but won't reach the
          # CVM unless re-exported here.
          DOCKER_REGISTRY: ${{ vars.DOCKER_REGISTRY }}
          FRONTEND_V010_MANIFEST: 'sha256:0e42a8c2df83e08068be633dc074d31acf07e0403ceaa0090688183fcf2c2d19'
          FRONTEND_BIG_BLOB: 'sha256:5a154c577d1ce015bbbe2b00d17f3554fdbea837080a914f384399528da9ed6b'
          ALL: ${{ inputs.all }}
          CHECK_CONFIG: ${{ inputs.check_config }}
          CHECK_SPEED: ${{ inputs.check_speed }}
          CHECK_DIGEST: ${{ inputs.check_digest }}
          PULL_FRONTEND: ${{ inputs.pull_frontend }}
          PULL_DB: ${{ inputs.pull_db }}
          APPLY_MIRROR: ${{ inputs.apply_mirror }}
          VERIFY_PULL: ${{ inputs.verify_pull }}
          GHCR_LOGIN: ${{ inputs.ghcr_login }}
        with:
          host: ${{ secrets.CVM_HOST }}
          username: ${{ vars.CVM_BOOTSTRAP_USER || 'ubuntu' }}
          key: ${{ secrets.CVM_BOOTSTRAP_SSH_KEY }}
          command_timeout: '30m'
          envs: DOCKER_REGISTRY,FRONTEND_V010_MANIFEST,FRONTEND_BIG_BLOB,ALL,CHECK_CONFIG,CHECK_SPEED,CHECK_DIGEST,PULL_FRONTEND,PULL_DB,APPLY_MIRROR,VERIFY_PULL,GHCR_LOGIN
          script: |
            set -e
            echo "diag-prod target=${{ inputs.target }}"
            echo "DOCKER_REGISTRY=${DOCKER_REGISTRY}"
            echo ""

            # Optional: docker login ghcr.io BEFORE running any pull_* check.
            # Pulls without login get "denied" from GHCR's anonymous pool.
            # The scp step above delivered /tmp/ghcr_user.txt + /tmp/ghcr_token.txt
            # only when inputs.ghcr_login=true. We sudo them so docker login
            # writes /root/.docker/config.json (matches what deploy-prod does).
            if [ "${GHCR_LOGIN}" = "true" ]; then
              if [ -s /tmp/ghcr_user.txt ] && [ -s /tmp/ghcr_token.txt ]; then
                echo '======================================================'
                echo '## 0. docker login ghcr.io (as root via sudo)'
                echo '======================================================'
                sudo bash -c '
                  set -e
                  sudo docker login ghcr.io -u "$(cat /tmp/ghcr_user.txt)" --password-stdin < /tmp/ghcr_token.txt
                  rm -f /tmp/ghcr_user.txt /tmp/ghcr_token.txt
                '
                echo ''
              else
                echo 'WARNING: ghcr_login=true but /tmp/ghcr_user.txt or /tmp/ghcr_token.txt missing on CVM' >&2
                echo 'WARNING: pulls will likely be denied by GHCR' >&2
              fi
            fi

            # helper: should we run a check?  honors inputs.all OR the per-check boolean.
            should_run() {
              local name="$1"
              if [ "${ALL}" = "true" ]; then return 0; fi
              local v="${!name}"
              [ "${v}" = "true" ]
            }

            if should_run CHECK_CONFIG; then
              echo '======================================================'
              echo '## 1. daemon.json + hosts.toml + docker info (mirror)'
              echo '======================================================'
              echo '--- /etc/docker/daemon.json ---'
              sudo cat /etc/docker/daemon.json 2>&1 || echo '(no daemon.json)'
              echo ''
              echo '--- /etc/containerd/certs.d/ghcr.io/hosts.toml ---'
              sudo cat /etc/containerd/certs.d/ghcr.io/hosts.toml 2>&1 || echo '(no hosts.toml)'
              echo ''
              echo '--- docker info (Registry Mirrors + Storage Driver) ---'
              sudo docker info 2>&1 | grep -iE 'registry mirrors|storage driver|username|http proxy|https proxy'
              echo ''
            fi

            if should_run CHECK_SPEED; then
              echo '======================================================'
              echo '## 2. curl speed - ghcr.io direct vs 3 mirrors (manifest GET, ~9 KB)'
              echo '======================================================'
              for pair in \
                "ghcr.io|https://ghcr.io/v2/zhangyu528/type-any-language/english_frontend/manifests/v0.1.0" \
                "ghcr.m.daocloud.io|https://ghcr.m.daocloud.io/v2/zhangyu528/type-any-language/english_frontend/manifests/v0.1.0" \
                "ghcr.nju.edu.cn|https://ghcr.nju.edu.cn/v2/zhangyu528/type-any-language/english_frontend/manifests/v0.1.0" \
                "ghcr.mirrors.ustc.edu.cn|https://ghcr.mirrors.ustc.edu.cn/v2/zhangyu528/type-any-language/english_frontend/manifests/v0.1.0"
              do
                label="${pair%%|*}"
                url="${pair#*|}"
                printf '%s\n' "--- $label ---"
                /usr/bin/time -f "  real=%e  HTTP=%{http_code}  speed=%{speed_download} B/s" \
                  curl -s -o /dev/null -w "  total=%{time_total}s\n" --max-time 30 "$url" \
                  || echo "  (curl failed)"
              done
              echo ''
              echo '--- layer GET (the big one we kept seeing stuck in deploy-prod) ---'
              blob="${FRONTEND_BIG_BLOB}"
              for pair in \
                "ghcr.io|https://ghcr.io/v2/zhangyu528/type-any-language/english_frontend/blobs/${blob}" \
                "ghcr.m.daocloud.io|https://ghcr.m.daocloud.io/v2/zhangyu528/type-any-language/english_frontend/blobs/${blob}" \
                "ghcr.nju.edu.cn|https://ghcr.nju.edu.cn/v2/zhangyu528/type-any-language/english_frontend/blobs/${blob}"
              do
                label="${pair%%|*}"
                url="${pair#*|}"
                printf '%s\n' "--- $label (1 MB slice of 246 MB layer) ---"
                /usr/bin/time -f "  real=%e  HTTP=%{http_code}  speed=%{speed_download} B/s" \
                  curl -s -r 0-1048575 -o /dev/null -w "  total=%{time_total}s\n" --max-time 60 "$url" \
                  || echo "  (curl failed)"
              done
              echo ''
            fi

            if should_run CHECK_DIGEST; then
              echo '======================================================'
              echo '## 3. manifest digest parity - does the mirror return the same bytes?'
              echo '======================================================'
              for pair in \
                "ghcr.io|https://ghcr.io/v2/zhangyu528/type-any-language/english_frontend/manifests/v0.1.0" \
                "ghcr.m.daocloud.io|https://ghcr.m.daocloud.io/v2/zhangyu528/type-any-language/english_frontend/manifests/v0.1.0" \
                "ghcr.nju.edu.cn|https://ghcr.nju.edu.cn/v2/zhangyu528/type-any-language/english_frontend/manifests/v0.1.0"
              do
                label="${pair%%|*}"
                url="${pair#*|}"
                digest=$(curl -sI --max-time 10 \
                  -H 'Accept: application/vnd.oci.image.manifest.v1+json' \
                  "$url" | grep -i '^docker-content-digest' | tr -d '\r' | awk '{print $2}')
                echo "  $label  ->  ${digest:-<no digest header>}"
              done
              echo ''
              echo "  reference (direct from GHCR): ${FRONTEND_V010_MANIFEST}"
              echo ''
            fi

            if should_run PULL_FRONTEND; then
              echo '======================================================'
              echo '## 4. end-to-end: sudo docker pull english_frontend:v0.1.0'
              echo '======================================================'
              /usr/bin/time -f "real=%e" \
                sudo docker pull ghcr.io/zhangyu528/type-any-language/english_frontend:v0.1.0 \
                || echo '(pull failed)'
              echo ''
            fi

            if should_run PULL_DB; then
              echo '======================================================'
              echo '## 5. end-to-end: sudo docker pull english_db:v0.1.0 (largest image)'
              echo '======================================================'
              /usr/bin/time -f "real=%e" \
                sudo docker pull ghcr.io/zhangyu528/type-any-language/english_db:v0.1.0 \
                || echo '(pull failed)'
              echo ''
            fi

            if ! should_run CHECK_CONFIG \
               && ! should_run CHECK_SPEED \
               && ! should_run CHECK_DIGEST \
               && ! should_run PULL_FRONTEND \
               && ! should_run PULL_DB; then
              echo '(no diagnostics selected — pass all=true or tick at least one checkbox)'
            fi

      # ---- apply_mirror: write ghcr.io mirror into daemon.json + restart docker.
      # Independent SSH step because Python heredoc can't nest cleanly inside
      # the main script block (yaml block scalar would choke on col-0 Python).
      - name: Apply ghcr.io mirror to CVM daemon.json + restart docker
        if: ${{ inputs.apply_mirror }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CVM_HOST }}
          username: ${{ vars.CVM_BOOTSTRAP_USER || 'ubuntu' }}
          key: ${{ secrets.CVM_BOOTSTRAP_SSH_KEY }}
          command_timeout: '5m'
          script: |
            set -e
            echo '======================================================'
            echo '## 6. APPLY: write ghcr.io mirror into /etc/docker/daemon.json + restart docker'
            echo '======================================================'
            echo '--- backup current daemon.json ---'
            sudo cp /etc/docker/daemon.json "/etc/docker/daemon.json.bak.$(date +%s)"
            ls -la /etc/docker/daemon.json*
            echo ''
            echo '--- merge mirrors (DaoCloud + NJU for ghcr.io) ---'
            # jq is safer than python here: no heredoc indent hell, and no
            # extra file to clean up. It is installed by the docker-ce apt
            # package as a runtime dep, so it is always present.
            sudo jq '
              if (.["registry-mirrors"] // []) | index("https://ghcr.m.daocloud.io") then . else
                .["registry-mirrors"] = ((.["registry-mirrors"] // []) + ["https://ghcr.m.daocloud.io"])
              end |
              if (.["registry-mirrors"] // []) | index("https://ghcr.nju.edu.cn") then . else
                .["registry-mirrors"] = ((.["registry-mirrors"] // []) + ["https://ghcr.nju.edu.cn"])
              end
            ' /etc/docker/daemon.json | sudo tee /etc/docker/daemon.json >/dev/null
            echo '--- updated daemon.json ---'
            sudo cat /etc/docker/daemon.json
            echo ''
            echo '--- restart docker ---'
            sudo systemctl restart docker
            sleep 3
            systemctl is-active docker
            echo ''
            echo '--- verify mirror list via docker info ---'
            sudo docker info 2>&1 | grep -A6 'Registry Mirrors'
            echo ''
            echo '--- quick curl sanity on DaoCloud (1 MB layer slice) ---'
            /usr/bin/time -f "  real=%e" \
              curl -s -r 0-1048575 -o /dev/null -w "  HTTP=%{http_code}  speed=%{speed_download} B/s\n" \
                --max-time 30 \
                https://ghcr.m.daocloud.io/v2/zhangyu528/type-any-language/english_frontend/blobs/sha256:5a154c577d1ce015bbbe2b00d17f3554fdbea837080a914f384399528da9ed6b \
              || echo '  (curl failed)'
            echo ''

      # ---- verify_pull: end-to-end docker pull after apply_mirror.
      # Assumes the previous step already restarted docker, so docker daemon
      # is now picking up the new mirrors.
      - name: "Verify: docker pull frontend after applying mirror"
        if: ${{ inputs.verify_pull }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.CVM_HOST }}
          username: ${{ vars.CVM_BOOTSTRAP_USER || 'ubuntu' }}
          key: ${{ secrets.CVM_BOOTSTRAP_SSH_KEY }}
          command_timeout: '10m'
          envs: GHCR_LOGIN
          script: |
            set -e
            if [ "${GHCR_LOGIN}" = "true" ]; then
              if [ -s /tmp/ghcr_user.txt ] && [ -s /tmp/ghcr_token.txt ]; then
                echo '--- docker login ghcr.io ---'
                sudo bash -c '
                  set -e
                  sudo docker login ghcr.io -u "$(cat /tmp/ghcr_user.txt)" --password-stdin < /tmp/ghcr_token.txt
                '
              fi
            fi
            echo '======================================================'
            echo '## 7. VERIFY: docker pull english_frontend (post-mirror, expect fast)'
            echo '======================================================'
            /usr/bin/time -f "real=%e" \
              sudo docker pull ghcr.io/zhangyu528/type-any-language/english_frontend:v0.1.0 \
              || echo '(pull failed)'
            echo ''
