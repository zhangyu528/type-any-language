name: release-prod
run-name: release-prod-${{ github.event.inputs.version || 'auto' }}

# Build and push prod app images (english_db + english_backend + english_frontend) to
# ${{ vars.DOCKER_REGISTRY }} (GitHub Container Registry / GHCR).
#
# Trigger: workflow_dispatch ONLY. The operator runs this manually
# after deciding what version to release. There is no auto-trigger
# (no push-tag, no workflow_run) — release + deploy are explicit,
# auditable, two-step process. Pair with deploy-prod, which is
# also manual and offers a version picker.
#
# Why manual-only:
#   - Release produces real artifacts pushed to the registry. An accidental
#     release is hard to roll back (have to delete registry images,
#     rotate tags, etc.). A "push tag → auto release" path is
#     dangerous in a small team where the same person writes code
#     and ships it.
#   - Forces a deliberate "I'm shipping now" moment in the GH UI,
#     which is where you want a human gate.
#
# Setup (one-time per repo):
#   1. GitHub → repo Settings → Environments → prod → Variables →
#      New environment variable:
#        Name:  DOCKER_REGISTRY
#        Value: ghcr.io/<owner>/type-any-language
#      This is the namespace prefix that push.sh / release.sh push to.
#
#   2. NO registry username/password needed. GHCR authenticates with the
#      built-in GITHUB_TOKEN (the workflow requests `permissions:
#      packages: write`), so no REGISTRY_USERNAME / REGISTRY_PASSWORD
#      secrets are required or referenced.
#
# What this workflow does:
#   - Checkout the default branch (release-prod always runs from
#     the latest committed code, NOT from a tag — the tag is
#     created by the operator, not the workflow).
#   - Login to ghcr.io using the GITHUB_TOKEN (no registry user/pass needed).
#   - Run ./ops/prod/release.sh prod <version> -y, which:
#       a) builds english_db + english_backend + english_frontend
#          via docker compose build (tag = the requested version).
#       b) tags + pushes them to $DOCKER_REGISTRY/english_*:vX.Y.Z.
#   - This workflow then creates a git tag + GitHub release for <version>
#     (the SINGLE SOURCE OF TRUTH for the deployed version — deploy-prod
#     "auto" resolves it on the runner; no per-segment VERSION files).
#
# After release-prod completes successfully, the operator runs
# deploy-prod (manual) to roll the images out to the CVM.
#
# NOTE on the CVM pull side (NOT configured by this file):
#   - This repo has NO ./REGISTRY file. The CVM's pull target is configured
#     locally on the CVM, not via this GitHub variable.
#   - The CVM must pull from the same $DOCKER_REGISTRY value
#     (ghcr.io/<owner>/type-any-language). If the repo is private, give the
#     CVM a GitHub read-only PAT with `read:packages`; public packages need
#     no login. Keep the CVM's value in sync with the env: prod variable.

on:
  workflow_dispatch:
    inputs:
      version:
        # ── SemVer bump 选择 (选择合适的 X.Y.Z) ──────────────────────
        # 1. PATCH  (X.Y.Z → X.Y.{Z+1})  — 默认选择
        #    修 bug / 性能优化 / typo / 内部重构 / 文档
        #    用户升级不需要改代码
        #
        # 2. MINOR  (X.Y.0)             — 仅在"明确发新功能"时
        #    加新功能 / 新 API endpoint / 新页面
        #    用户升级不需要改代码
        #
        # 3. MAJOR  (X.0.0)             — API 破坏性变更
        #    重命名/删除公开 API / 不兼容的接口改动
        #    用户升级必须改代码
        #
        # 本项目还在 0.x.y, 所以破坏性变更也可以用 MINOR.
        # 日常修复用 PATCH 就够了.
        # ──────────────────────────────────────────────────────────
        description: 'X.Y.Z (without v prefix) — 见上面 SemVer 规则. 日常修选用 PATCH.'
        required: true
        type: string
        pattern: '^\d+\.\d+\.\d+$'

permissions:
  contents: write   # release.sh's git_commit_touched does `git commit`
  packages: write   # push to GHCR (ghcr.io)

concurrency:
  # Avoid two releases racing on the same VERSION files.
  group: release-prod
  cancel-in-progress: false

jobs:
  release-prod:
    runs-on: ubuntu-latest
    environment: prod   # optional: pause dispatch runs for reviewer approval
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Tag-push: checkout the tag itself so the working tree matches
          # the released VERSION. Dispatch: checkout the default branch.
          ref: ${{ github.event_name == 'push' && github.ref || github.event.repository.default_branch }}
          fetch-depth: 0   # need history for release.sh's git_commit_touched

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # github.ref is refs/tags/vX.Y.Z — strip the prefix
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION="${{ inputs.version }}"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be X.Y.Z (got: $VERSION)"
            exit 1
          fi
          echo "version=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: v${VERSION}"

      - name: Login to ${{ vars.DOCKER_REGISTRY }}
        if: vars.DOCKER_REGISTRY != ''
        run: |
          if [ -z "${{ vars.DOCKER_REGISTRY }}" ]; then
            echo "::error::DOCKER_REGISTRY variable not set — push has nowhere to go"
            exit 1
          fi
          # GHCR (ghcr.io) authenticates with the built-in GITHUB_TOKEN;
          # other registries (e.g. Tencent CCR) use REGISTRY_USERNAME/PASSWORD.
          if [[ "${{ vars.DOCKER_REGISTRY }}" == ghcr.io/* ]]; then
            echo "${{ secrets.GITHUB_TOKEN }}" | \
              docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          else
            echo "${{ secrets.REGISTRY_PASSWORD }}" | \
              docker login "${{ vars.DOCKER_REGISTRY }}" \
                         -u "${{ secrets.REGISTRY_USERNAME }}" \
                         --password-stdin
          fi

      - name: Verify DOCKER_REGISTRY is set
        env:
          DOCKER_REGISTRY: ${{ vars.DOCKER_REGISTRY }}
        run: |
          if [ -z "$DOCKER_REGISTRY" ]; then
            echo "::error::GH Variable DOCKER_REGISTRY 未配置"
            echo "  → GH repo → Settings → Environments → prod → Variables → New"
            echo "  → Name: DOCKER_REGISTRY, Value: ghcr.io/zhangyu528/type-any-language"
            exit 1
          fi
          echo "DOCKER_REGISTRY=$DOCKER_REGISTRY (source=GH Variable)"

      - name: Run release.sh prod ${{ steps.version.outputs.version }} -y
        env:
          # release.sh reads DOCKER_REGISTRY; pass it explicitly so the
          # GH Variable reaches the script.
          DOCKER_REGISTRY: ${{ vars.DOCKER_REGISTRY }}
          GIT_SHA: ${{ github.sha }}
        run: |
          # actions/checkout doesn't preserve file mode bits; restore
          # execute on the scripts we shell out to.
          chmod +x ops/prod/release.sh ops/prod/build/image.sh ops/prod/build/push.sh
          bash ops/prod/release.sh prod "${{ steps.version.outputs.version }}" -y

      - name: Mirror nginx:alpine from docker.io to GHCR via crane copy
        env:
          DOCKER_REGISTRY: ${{ vars.DOCKER_REGISTRY }}
        run: |
          # Pulling nginx:alpine from docker.io on the CVM hits a slow
          # path: the daemon tries an OCI referrer query against
          # registry-1.docker.io directly (bypassing our docker.io
          # mirror config in /etc/docker/certs.d/docker.io/hosts.toml)
          # and that path times out from CN-region CVMs. The actual
          # image layers do download, but the referrer failure makes
          # `docker compose up -d` exit non-zero.
          #
          # Workaround: mirror nginx:alpine into our GHCR namespace so
          # the CVM pulls it the same way as the 3 custom images —
          # entirely through ghcr.io where our ghcr.m.daocloud.io +
          # ghcr.nju.edu.cn mirrors work, no referrer query, no extra
          # round trip to docker.io.
          set -e
          if [ -z "$DOCKER_REGISTRY" ]; then
            echo "::error::DOCKER_REGISTRY not set; skipping nginx mirror"
            exit 0
          fi
          # Install crane (go-containerregistry CLI) — small, single binary.
          # Pin a recent version known to handle referrer copy.
          CRANE_VERSION="v0.20.1"
          echo "::group::installing crane ${CRANE_VERSION}"
          curl -fsSL "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz" \
            | tar -xz -C /tmp crane
          chmod +x /tmp/crane
          /tmp/crane version
          echo "::endgroup::"
          # Copy nginx:alpine from docker.io to ${DOCKER_REGISTRY}/nginx:alpine.
          # The source repo is the official Docker Hub 'library/nginx'; GHCR
          # namespacing means we need to re-tag under our org.
          SRC="docker.io/library/nginx:alpine"
          DST="${DOCKER_REGISTRY}/nginx:alpine"
          echo "::group::crane copy ${SRC} -> ${DST}"
          /tmp/crane copy "$SRC" "$DST"
          echo "::endgroup::"
          # Sanity check — confirm the GHCR copy resolves.
          /tmp/crane manifest "$DST" >/dev/null && echo "verified: ${DST} manifest fetchable"

      - name: Tag + create GitHub release
        # Full cleanup (2026-08-06): the git tag is now the SINGLE SOURCE OF
        # TRUTH for the deployed version. deploy-prod "auto" resolves the
        # latest release/tag on the runner (CVM never touches github.com).
        # release.sh no longer writes per-segment VERSION files.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          # Annotated tag on the default-branch HEAD.
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "tag $VERSION already exists — skip tag create"
          else
            git tag -a "$VERSION" -m "release $VERSION"
            git push origin "$VERSION"
            echo "pushed tag $VERSION"
          fi
          # GitHub release so deploy-prod "auto" can list the latest.
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "release $VERSION already exists — skip release create"
          else
            gh release create "$VERSION" --title "$VERSION" --generate-notes
            echo "created release $VERSION"
          fi

      - name: Logout
        if: always()
        run: docker logout "${{ vars.DOCKER_REGISTRY }}" || true