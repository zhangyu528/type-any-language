# Site config for type-any-language — reverse proxy for backend +
# frontend running in compose on the same host.
#
# This file is included from /etc/nginx/nginx.conf via the
# `include /etc/nginx/sites-enabled/*;` directive, so it must be a
# *fragment* — only upstream + server blocks. The `events` and
# `http` blocks (which are required at the top level of a full
# nginx.conf) are not allowed here — see /etc/nginx/nginx.conf for
# the parent context.
#
# Upstreams point at the host loopback because backend + frontend
# containers bind `127.0.0.1:8000` / `127.0.0.1:3000` (see
# docker-compose.yml). System nginx (this file's consumer) is not
# inside the compose network, so it has to use 127.0.0.1.
#
# Earlier revisions shipped a full nginx.conf here (with events {}
# and http {} at top level), which produced "events directive is
# not allowed here" when nginx loaded it as a sites-enabled
# fragment. We split into two files:
#   - ops/prod/nginx.conf         (this file) — fragment for sites-available
#   - ops/prod/nginx-full.conf    (legacy; see comments at top) — DO NOT USE
#
# bootstrap.sh's step_nginx_site_link installs this file directly
# into /etc/nginx/sites-available/type-any-language, then enables
# it via /etc/nginx/sites-enabled/type-any-language.

upstream tal_backend {
    server 127.0.0.1:8000;
}

upstream tal_frontend {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    server_name localhost;

    # API requests
    location /api/ {
        proxy_pass http://tal_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Audio is NOT served from this nginx. The frontend reads
    # sentence.audio_url (a full Tencent Cloud COS URL baked into
    # the db image at build time) and the browser streams directly
    # from COS — no /audio path on this server.

    # Frontend static / Next.js
    location / {
        proxy_pass http://tal_frontend;
        proxy_set_header Host $host;
    }
}